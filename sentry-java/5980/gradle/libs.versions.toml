[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"
# Versions reported in getsentry/sentry-java#5980.
sagp = "6.19.0"
sentry = "8.53.0"
room3 = "3.0.1"
sqlite = "2.7.0"
coroutines = "1.10.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sagp" }

[libraries]
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
sentry-android-sqlite = { module = "io.sentry:sentry-android-sqlite", version.ref = "sentry" }
